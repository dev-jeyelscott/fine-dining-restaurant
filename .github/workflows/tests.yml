name: tests

on:
  push:
    branches:
      - develop
      - main
      - master
      - workos
  pull_request: {}

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ["8.4", "8.5"]

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: gd
          tools: composer:v2
          coverage: xdebug

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "25"

      - name: Install Node Dependencies
        run: npm i

      - name: Add Flux Credentials Loaded From ENV
        run: composer config http-basic.composer.fluxui.dev "${{ secrets.FLUX_USERNAME }}" "${{ secrets.FLUX_LICENSE_KEY }}"

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Build Assets
        run: npm run build

      - name: Run Type Analysis
        id: type-analysis
        continue-on-error: true
        run: composer types:check > type-analysis.log 2>&1

      - name: Upload Type Analysis Diagnostics
        if: steps.type-analysis.outcome == 'failure'
        uses: actions/upload-artifact@84480863f228bb9747b473957fcc9e309aa96097 # v4.4.2
        with:
          name: type-analysis-php-${{ matrix.php-version }}
          path: type-analysis.log
          if-no-files-found: error

      - name: Fail On Type Analysis Errors
        if: steps.type-analysis.outcome == 'failure'
        run: exit 1

      - name: Run Responsive Image Tests
        run: php artisan test --compact tests/Feature/ResponsiveImagePipelineTest.php

      - name: Run Gallery Page Tests
        run: php artisan test --compact tests/Feature/GalleryPageTest.php

      - name: Run Public Pages Tests
        run: php artisan test --compact tests/Feature/PublicPagesTest.php

      - name: Run Tests
        id: full-tests
        continue-on-error: true
        run: php artisan test > full-tests.log 2>&1

      - name: Upload Full Test Diagnostics
        if: steps.full-tests.outcome == 'failure'
        uses: actions/upload-artifact@84480863f228bb9747b473957fcc9e309aa96097 # v4.4.2
        with:
          name: full-tests-php-${{ matrix.php-version }}
          path: full-tests.log
          if-no-files-found: error

      - name: Fail On Test Errors
        if: steps.full-tests.outcome == 'failure'
        run: exit 1
