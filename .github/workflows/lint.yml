name: lint

on:
  push:
    branches:
      - develop
      - main
      - master
      - workos
  pull_request: {}

permissions:
  contents: read

jobs:
  pint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Add Flux Credentials Loaded From ENV
        run: composer config http-basic.composer.fluxui.dev "${{ secrets.FLUX_USERNAME }}" "${{ secrets.FLUX_LICENSE_KEY }}"

      - name: Install Dependencies
        run: composer install --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Run Pint Check
        id: pint
        continue-on-error: true
        run: composer lint:check > pint.log 2>&1

      - name: Upload Pint Diagnostics
        if: steps.pint.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pint-diagnostics
          path: pint.log
          if-no-files-found: error

      - name: Fail On Formatting Errors
        if: steps.pint.outcome == 'failure'
        run: exit 1
