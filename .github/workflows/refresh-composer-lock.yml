name: refresh composer lock metadata

on:
  push:
    branches:
      - develop
    paths:
      - .github/workflows/refresh-composer-lock.yml

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.5"
          tools: composer:v2
          coverage: none

      - name: Add Flux credentials
        run: composer config http-basic.composer.fluxui.dev "${{ secrets.FLUX_USERNAME }}" "${{ secrets.FLUX_LICENSE_KEY }}"

      - name: Refresh lock metadata
        run: composer update --lock --no-install --no-scripts --no-interaction

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Commit refreshed lock file
        run: |
          if git diff --quiet -- composer.lock; then
            echo "composer.lock is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock
          git commit -m "chore(metadata): refresh composer lock hash"
          git push origin HEAD:develop
